services:
  # ── Main Full-Stack Application (Frontend + Backend API) ────────────────
  - type: web
    name: kheticonnect-app
    runtime: node
    plan: free
    buildCommand: npm run build && npm --prefix server install
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard

