<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KhetiConnect – Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --card: #162032;
      --border: #334155;
      --green: #22c55e;
      --green-dark: #16a34a;
      --red: #ef4444;
      --yellow: #f59e0b;
      --blue: #3b82f6;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --radius: 12px;
    }

    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Login Screen ── */
    #login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 60% 20%, #1a3a2a 0%, #0f172a 70%);
    }
    .login-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 2.5rem; width: 380px; box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }
    .login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; }
    .login-logo .icon { width: 44px; height: 44px; background: var(--green); border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
    .login-logo h1 { font-size: 1.2rem; font-weight: 700; }
    .login-logo p { font-size: 0.75rem; color: var(--muted); }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    input, select, textarea {
      width: 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 0.9rem; font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--green); }
    .btn {
      width: 100%; padding: 11px; border: none; border-radius: 8px; font-size: 0.95rem;
      font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit;
    }
    .btn-green { background: var(--green); color: #fff; }
    .btn-green:hover { background: var(--green-dark); transform: translateY(-1px); }
    .btn-red { background: var(--red); color: #fff; }
    .btn-red:hover { opacity: 0.85; }
    .btn-sm { width: auto; padding: 6px 14px; font-size: 0.8rem; }
    .error-msg { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; display: none; }

    /* ── Dashboard Layout ── */
    #dashboard { display: none; flex-direction: column; min-height: 100vh; }

    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
    }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .header-brand .icon { width: 36px; height: 36px; background: var(--green); border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .header-brand span { font-weight: 700; font-size: 1rem; }
    .header-brand small { display: block; font-size: 0.7rem; color: var(--muted); }
    .logout-btn { background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
    .logout-btn:hover { border-color: var(--red); color: var(--red); }

    main { flex: 1; padding: 2rem; max-width: 1100px; margin: 0 auto; width: 100%; }

    /* Stats Bar */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.2rem; text-align: center; }
    .stat-card .num { font-size: 2rem; font-weight: 800; color: var(--green); }
    .stat-card .label { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

    /* Add Vehicle Form */
    .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
    .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 2rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .span2 { grid-column: span 2; }

    /* Vehicles Table */
    .vehicles-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .search-bar { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); }
    .search-bar input { max-width: 300px; padding: 8px 14px; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 12px 16px; text-align: left; font-size: 0.78rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); }
    td { padding: 12px 16px; font-size: 0.88rem; border-bottom: 1px solid rgba(51,65,85,0.4); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.03); }

    .badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 0.72rem; font-weight: 600; }
    .badge-green { background: rgba(34,197,94,0.15); color: var(--green); }
    .badge-yellow { background: rgba(245,158,11,0.15); color: var(--yellow); }
    .badge-blue { background: rgba(59,130,246,0.15); color: var(--blue); }
    .badge-red { background: rgba(239,68,68,0.15); color: var(--red); }

    .icon-btn { background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; margin-right: 4px; }
    .icon-btn:hover { border-color: var(--green); color: var(--green); }
    .icon-btn.danger:hover { border-color: var(--red); color: var(--red); }

    /* Toast */
    #toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem; padding: 12px 20px; border-radius: 10px;
      font-size: 0.88rem; font-weight: 500; z-index: 999; transition: all 0.3s;
      opacity: 0; transform: translateY(10px); pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { background: var(--green); color: #fff; }
    #toast.error   { background: var(--red);   color: #fff; }

    /* Loading */
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty { text-align: center; padding: 3rem; color: var(--muted); font-size: 0.9rem; }
    .price { font-weight: 600; color: var(--green); }
    .type-tag { background: rgba(59,130,246,0.12); color: var(--blue); padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; }
  </style>
</head>
<body>

<!-- ── Login ── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">🌾</div>
      <div>
        <h1>KhetiConnect</h1>
        <p>Admin Control Panel</p>
      </div>
    </div>
    <div id="login-error" class="error-msg"></div>
    <div class="form-group">
      <label>Admin Email</label>
      <input type="email" id="login-email" placeholder="admin@kheti.com" value="admin@kheti.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" value="admin123" />
    </div>
    <button class="btn btn-green" id="login-btn" onclick="login()">Sign In as Admin</button>
  </div>
</div>

<!-- ── Dashboard ── -->
<div id="dashboard">
  <header>
    <div class="header-brand">
      <div class="icon">🌾</div>
      <div>
        <span>KhetiConnect Admin</span>
        <small>Transport Vehicle Manager</small>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <main>
    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="num" id="stat-total">–</div>
        <div class="label">Total Vehicles</div>
      </div>
      <div class="stat-card">
        <div class="num" id="stat-available">–</div>
        <div class="label">Available</div>
      </div>
      <div class="stat-card">
        <div class="num" id="stat-types">–</div>
        <div class="label">Vehicle Types</div>
      </div>
    </div>

    <!-- Add Vehicle -->
    <div class="form-card">
      <div class="section-title">🚛 Add New Transport Vehicle</div>
      <form id="add-form" onsubmit="addVehicle(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Owner / Company Name *</label>
            <input type="text" id="f-name" placeholder="e.g. Ramesh Transport Co." required />
          </div>
          <div class="form-group">
            <label>Vehicle Type *</label>
            <select id="f-type" required>
              <option value="">Select type...</option>
              <option>Mini Truck</option>
              <option>Tata Ace</option>
              <option>Tempo</option>
              <option>Container</option>
              <option>Refrigerated</option>
              <option>Pickup</option>
            </select>
          </div>
        </div>
        <div class="form-grid-3">
          <div class="form-group">
            <label>Capacity *</label>
            <input type="text" id="f-capacity" placeholder="e.g. 5 MT" required />
          </div>
          <div class="form-group">
            <label>From City *</label>
            <input type="text" id="f-from" placeholder="e.g. Nashik" required />
          </div>
          <div class="form-group">
            <label>To City *</label>
            <input type="text" id="f-to" placeholder="e.g. Mumbai" required />
          </div>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label>Price per Trip (₹) *</label>
            <input type="number" id="f-price" placeholder="e.g. 3200" min="0" required />
          </div>
          <div class="form-group">
            <label>ETA</label>
            <input type="text" id="f-eta" placeholder="e.g. 6–8 hrs" />
          </div>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="f-phone" placeholder="+91-98765-43210" />
          </div>
          <div class="form-group">
            <label>Badge (optional)</label>
            <select id="f-badge">
              <option value="">None</option>
              <option>Top Rated</option>
              <option>Verified</option>
              <option>Admin Verified</option>
              <option>New</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Features (comma-separated)</label>
          <input type="text" id="f-features" placeholder="GPS Tracked, Insured, Cold Chain" />
        </div>
        <button type="submit" class="btn btn-green" id="add-btn">➕ Add Vehicle</button>
      </form>
    </div>

    <!-- Vehicles Table -->
    <div class="vehicles-card">
      <div class="search-bar">
        <div class="section-title" style="margin-bottom:0;">🚚 Manage Vehicles</div>
      </div>
      <div id="vehicles-list">
        <div class="empty">Loading vehicles... <span class="spinner"></span></div>
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>

<script>
  const API = window.location.origin;
  let token = '';
  let vehicles = [];

  // ── Toast ──────────────────────────────────────────────────────────────────
  function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `show ${type}`;
    setTimeout(() => { el.className = ''; }, 3000);
  }

  // ── Auth ───────────────────────────────────────────────────────────────────
  async function login() {
    const email    = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const errEl    = document.getElementById('login-error');
    const btn      = document.getElementById('login-btn');

    btn.innerHTML = '<span class="spinner"></span> Signing in...';
    btn.disabled  = true;
    errEl.style.display = 'none';

    try {
      const res  = await fetch(`${API}/admin/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (data.success) {
        token = data.token;
        showDashboard();
      } else {
        errEl.textContent = data.message;
        errEl.style.display = 'block';
      }
    } catch {
      errEl.textContent = 'Cannot connect to admin server on port 5001. Make sure it is running.';
      errEl.style.display = 'block';
    }

    btn.innerHTML = 'Sign In as Admin';
    btn.disabled  = false;
  }

  function logout() {
    token = '';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
  }

  function showDashboard() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';
    loadVehicles();
  }

  // ── Vehicles ───────────────────────────────────────────────────────────────
  async function loadVehicles() {
    try {
      const res  = await fetch(`${API}/admin/vehicles`, { headers: { Authorization: `Bearer ${token}` } });
      const data = await res.json();
      if (!data.success) throw new Error(data.message);
      vehicles = data.vehicles;
      renderTable();
      updateStats();
    } catch (err) {
      document.getElementById('vehicles-list').innerHTML =
        `<div class="empty">⚠️ ${err.message || 'Failed to load vehicles'}</div>`;
    }
  }

  function updateStats() {
    document.getElementById('stat-total').textContent     = vehicles.length;
    document.getElementById('stat-available').textContent = vehicles.filter(v => v.available).length;
    const types = [...new Set(vehicles.map(v => v.vehicleType))];
    document.getElementById('stat-types').textContent     = types.length;
  }

  function renderTable() {
    if (!vehicles.length) {
      document.getElementById('vehicles-list').innerHTML = '<div class="empty">No vehicles found. Add one above!</div>';
      return;
    }
    const rows = vehicles.map(v => `
      <tr>
        <td><b>${v.name}</b></td>
        <td><span class="type-tag">${v.vehicleType}</span></td>
        <td>${v.capacity}</td>
        <td>${v.from} → ${v.to}</td>
        <td class="price">₹${v.price.toLocaleString()}</td>
        <td>${v.eta || '–'}</td>
        <td>
          ${v.available
            ? '<span class="badge badge-green">Available</span>'
            : '<span class="badge badge-red">Unavailable</span>'}
        </td>
        <td>
          <button class="icon-btn" onclick="toggleAvail('${v._id || v.id}')">Toggle</button>
          <button class="icon-btn danger" onclick="deleteVehicle('${v._id || v.id}')">Delete</button>
        </td>
      </tr>
    `).join('');

    document.getElementById('vehicles-list').innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Type</th><th>Capacity</th>
            <th>Route</th><th>Price</th><th>ETA</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  async function addVehicle(e) {
    e.preventDefault();
    const btn = document.getElementById('add-btn');
    btn.innerHTML = '<span class="spinner"></span> Adding...';
    btn.disabled  = true;

    const features = document.getElementById('f-features').value
      .split(',').map(s => s.trim()).filter(Boolean);

    const body = {
      name:        document.getElementById('f-name').value,
      vehicleType: document.getElementById('f-type').value,
      capacity:    document.getElementById('f-capacity').value,
      from:        document.getElementById('f-from').value,
      to:          document.getElementById('f-to').value,
      price:       document.getElementById('f-price').value,
      eta:         document.getElementById('f-eta').value || '4–6 hrs',
      phone:       document.getElementById('f-phone').value || '+91-90000-00000',
      badge:       document.getElementById('f-badge').value || null,
      features:    features.length ? features : ['GPS Tracked', 'Insured'],
    };

    try {
      const res  = await fetch(`${API}/admin/vehicles`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (data.success) {
        toast('✅ Vehicle added successfully!');
        document.getElementById('add-form').reset();
        loadVehicles();
      } else {
        toast(data.message, 'error');
      }
    } catch (err) {
      toast('Failed to add vehicle', 'error');
    }

    btn.innerHTML = '➕ Add Vehicle';
    btn.disabled  = false;
  }

  async function deleteVehicle(id) {
    if (!confirm('Delete this vehicle?')) return;
    try {
      const res  = await fetch(`${API}/admin/vehicles/${id}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (data.success) {
        toast('🗑️ Vehicle deleted');
        loadVehicles();
      } else {
        toast(data.message, 'error');
      }
    } catch {
      toast('Failed to delete', 'error');
    }
  }

  async function toggleAvail(id) {
    try {
      const res  = await fetch(`${API}/admin/vehicles/${id}`, {
        method: 'PATCH',
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (data.success) {
        toast(`✔️ ${data.message}`);
        loadVehicles();
      } else {
        toast(data.message, 'error');
      }
    } catch {
      toast('Failed to toggle availability', 'error');
    }
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') login();
  });
</script>
</body>
</html>
